[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "htsave"
version = "1.0.0"
description = "Lossless repeated-context saving for Codex CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["codex", "context", "deduplication", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=1.20,<2",
  "platformdirs>=4.3,<5",
  "tiktoken>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130,<7",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
htsave = "htsave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/htsave"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/htsave" = "htsave/_plugin/htsave"
"benchmark/templates" = "htsave/_benchmark_templates"

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/src",
  "/plugin",
  "/tests",
  "/benchmark",
  "/docs",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["htsave"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
